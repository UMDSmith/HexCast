<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="/static/hexcast.png">
<link rel="stylesheet" href="/static/hexbar.css?v=2">
<title>Hexcast - Plugins</title>
<style>
  :root{
    --bg:var(--hb-bg); --panel:var(--hb-panel); --line:var(--hb-line); --ink:var(--hb-ink);
    --dim:var(--hb-dim); --good:var(--hb-good);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 'Segoe UI',system-ui,sans-serif;}
  main{padding:8px 22px 70px;max-width:1240px}
  h1{margin:6px 0 4px;font-size:22px}
  .lead{margin:0 0 6px;color:var(--dim);max-width:70ch}
  .lead code{color:var(--good);font:12.5px var(--hb-mono)}
</style></head>
<body>
<div id="hexbar" data-section="Plugins" data-key="store"></div>
<script src="/static/hexbar.js?v=2"></script>

<main>
  <h1>Add to Hexcast</h1>
  <p class="lead">Hexcast starts with just the soundboard. Add only the parts you use &mdash; each one installs in a few
    seconds, with no restart. Removing one keeps your settings, so adding it back later picks up where you left off.</p>
  <div id="store"></div>
</main>

<script src="/static/plugin_store.js"></script>
<script>HexStore.mount(document.getElementById('store'), { parent: null, noun: 'plugin' });</script>
</body></html>
