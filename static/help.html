<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="/static/hexcast.png">
<link rel="stylesheet" href="/static/hexbar.css?v=2">
<title><!--HELP_TITLE--> - HexCast Help</title>
<style>
  :root{
    --bg:var(--hb-bg); --panel:var(--hb-panel); --line:var(--hb-line); --ink:var(--hb-ink);
    --dim:var(--hb-dim); --accent:var(--hb-accent); --good:var(--hb-good); --warn:var(--hb-warn);
    --mono:var(--hb-mono);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 'Segoe UI',system-ui,sans-serif;}
  .wrap{display:flex;gap:26px;align-items:flex-start;padding:6px 22px 60px;max-width:1300px}
  nav.side{flex:0 0 220px;position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto;padding:4px 0}
  nav.side h4{margin:16px 0 6px;font:800 11px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
  nav.side h4:first-child{margin-top:0}
  nav.side a{display:block;padding:6px 10px;border-radius:8px;color:var(--dim);text-decoration:none;font-size:14px;font-weight:600}
  nav.side a:hover{color:var(--ink);background:var(--hb-card,#17171f)}
  nav.side a.sel{color:var(--ink);background:var(--panel);box-shadow:inset 3px 0 0 var(--good)}
  main{flex:1;min-width:0;max-width:960px}
  .crumbs{margin:0 0 12px;font-size:13px;color:var(--dim)}
  .crumbs a{color:var(--dim);text-decoration:none}.crumbs a:hover{color:var(--ink)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px}
  .card h2{margin:0 0 4px;font-size:14px;letter-spacing:.14em;text-transform:uppercase}
  .card h2 .tag{font:600 10px/1 var(--mono);letter-spacing:.08em;border:1px solid var(--line);
                border-radius:99px;padding:3px 8px;margin-left:8px;vertical-align:2px;color:var(--dim)}
  .card h3{margin:16px 0 4px;font-size:13px;color:var(--ink);scroll-margin-top:16px}
  .card p.hint{margin:0 0 10px;color:var(--dim);font-size:13px}
  .card a{color:var(--good)}
  code{color:var(--good);font:12.5px var(--mono)}
  pre{background:#08080c;border:1px solid var(--line);border-radius:8px;padding:12px;
      font:12.5px/1.6 var(--mono);color:var(--good);overflow:auto;margin:8px 0}
  table.api{width:100%;border-collapse:collapse;font-size:13px;margin:6px 0 4px}
  table.api td{padding:6px 8px;border-top:1px solid var(--line);vertical-align:top;color:var(--dim)}
  table.api td:first-child{white-space:nowrap;font:12.5px var(--mono);color:var(--good)}
  section{scroll-margin-top:16px}
  /* the "on this page" jump list of a long reference */
  .jump{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px}
  .jump a,.pill{background:var(--hb-card,#17171f);border:1px solid var(--line);border-radius:99px;
         color:var(--ink);text-decoration:none;font-size:12.5px;font-weight:600;padding:5px 12px}
  .jump a:hover{border-color:var(--hb-line-hi,#35354a)}
  .jump b{font:800 10px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--dim);align-self:center;margin-right:2px}
  /* the index */
  h1{margin:6px 0 4px;font-size:24px}
  .lead{color:var(--dim);margin:0 0 18px;max-width:720px}
  .grp{margin:26px 0 10px;font:800 12px/1 var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
  a.hc{display:block;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;
       color:var(--ink);text-decoration:none}
  a.hc:hover{border-color:var(--hb-line-hi,#35354a)}
  a.hc b{font-size:15px}
  a.hc .tag{font:600 10px/1 var(--mono);letter-spacing:.06em;border:1px solid var(--line);border-radius:99px;
            padding:3px 8px;margin-left:8px;color:var(--dim);vertical-align:2px}
  a.hc p{margin:6px 0 0;color:var(--dim);font-size:13px}
  @media (max-width:820px){
    .wrap{flex-direction:column;gap:10px;align-items:stretch}
    main{width:100%}
    nav.side{position:static;flex:none;max-height:none;width:100%;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
    nav.side h4{width:100%;margin:8px 0 0}
    nav.side a{padding:5px 10px;border:1px solid var(--line);border-radius:99px}
    .card p.hint,table.api td{overflow-wrap:anywhere}
    table.api td:first-child{white-space:normal;width:40%}
  }
</style></head>
<body>

<div id="hexbar" data-section="Help"></div>

<div class="wrap">
<nav class="side" aria-label="Help pages">
<!--HELP_NAV-->
</nav>
<main>
<!--HELP_CRUMBS-->
<!--HELP_BODY-->
</main>
</div>

<script>
/* Old links (/help#craps) still land on the right page. */
(function () {
  var map = /*HELP_ANCHORS*/{};
  var h = location.hash.slice(1);
  if (location.pathname.replace(/\/$/, '') === '/help' && h && map[h]) location.replace('/help/' + map[h] + '#' + h);
})();
/* "On this page": a row of links to the headings of a long reference. */
(function () {
  var hs = document.querySelectorAll('main .card h3');
  if (hs.length < 3 || document.querySelector('main .grp')) return;
  var box = document.createElement('div'); box.className = 'jump';
  box.innerHTML = '<b>On this page</b>';
  var used = {};
  hs.forEach(function (h) {
    var id = h.id || h.textContent.toLowerCase().replace(/&/g, 'and').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 40) || 'part';
    while (used[id]) id += '-2';
    used[id] = 1; h.id = id;
    var a = document.createElement('a'); a.href = '#' + id;
    a.textContent = h.textContent.replace(/\s*\(.*$/, '').trim().slice(0, 34);
    box.appendChild(a);
  });
  var first = document.querySelector('main section');
  if (first) first.parentNode.insertBefore(box, first);
  if (location.hash) { var t = document.getElementById(location.hash.slice(1)); if (t) t.scrollIntoView(); }
})();
</script>
<script src="/static/hexbar.js?v=2"></script>
</body></html>
