<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<title>HexCast Clips Overlay</title>
<style>
  html, body { margin:0; padding:0; background:transparent; overflow:hidden;
               width:100vw; height:100vh; }
  /* Nothing exists unless a clip is playing - idle is fully transparent. */
  #stage { position:fixed; inset:0; }
  #stage video, #stage iframe {
    position:absolute; inset:0; width:100vw; height:100vh; border:0; display:block;
    object-fit:contain; background:transparent;
  }
  /* Channel credit: where the clip came from, drawn over the video. Lives
     outside #stage so clearStage()'s innerHTML wipe never removes it.
     Center-anchored x/y like the soundboard's positioned visuals. */
  #credit {
    position:fixed; transform:translate(-50%,-50%); z-index:2; display:none;
    text-align:center; white-space:nowrap; pointer-events:none;
    font-family:'Segoe UI',system-ui,sans-serif; font-weight:600; color:#fff;
  }
  #credit .t { display:block; font-weight:700; opacity:.92; }
  #credit .c { display:block; }
  /* Only ever shown in a normal browser tab when Chrome blocks unmuted
     autoplay - OBS's browser source never triggers it. */
  #mutehint {
    position:fixed; left:50%; bottom:24px; transform:translateX(-50%);
    background:rgba(11,11,16,.85); color:#fff; border:1px solid #35354a;
    border-radius:99px; padding:10px 18px; font:600 14px 'Segoe UI',system-ui,sans-serif;
    cursor:pointer; z-index:5;
  }
</style></head>
<body>
<div id="stage"></div>
<div id="credit"><span class="t"></span><span class="c"></span></div>
<script>
var stage = document.getElementById('stage');
var current = null;       // {id, el, mode, hls}
var volume = 1.0;
var hbTimer = null;
var hlsLib = null;        // promise for the hls.js script load
var creditEl = document.getElementById('credit');
var creditCfg = null;     // settings().credit from config broadcasts
var creditItem = null;    // the playing item (carries .credit / .title)

function loadFont(name){
  if (!name) return;
  var id = 'font-' + name.replace(/[^a-z0-9]/gi,'');
  if (document.getElementById(id)) return;
  var l = document.createElement('link');
  l.id = id; l.rel = 'stylesheet';
  l.href = 'https://fonts.googleapis.com/css2?family=' +
           encodeURIComponent(name).replace(/%20/g,'+') +
           ':wght@400;500;600;700;800;900&display=swap';
  document.head.appendChild(l);
}

function applyCredit(){
  var c = creditCfg;
  var chan  = (creditItem && creditItem.credit) || '';
  var title = (c && c.show_title && creditItem && creditItem.title) || '';
  if (!c || !c.enabled || (!chan && !title)){ creditEl.style.display = 'none'; return; }
  if (c.font_family){
    loadFont(c.font_family);
    creditEl.style.fontFamily = '"' + c.font_family + '", "Segoe UI", system-ui, sans-serif';
  } else creditEl.style.fontFamily = '';
  // px sizes are designed against a 1920-wide canvas, scaled to the actual
  // browser-source width so the label keeps its proportions at any size.
  var scale = (window.innerWidth / 1920) || 1;
  creditEl.style.fontSize = ((c.font_size || 30) * scale) + 'px';
  creditEl.style.color = c.color || '#fff';
  creditEl.style.textShadow = (c.shadow === false)
      ? 'none' : '0 2px 8px rgba(0,0,0,.85), 0 0 2px rgba(0,0,0,.9)';
  creditEl.style.left = (c.x == null ? 50 : c.x) + '%';
  creditEl.style.top  = (c.y == null ? 92 : c.y) + '%';
  var t = creditEl.querySelector('.t'), ch = creditEl.querySelector('.c');
  t.textContent = title;  t.style.display  = title ? '' : 'none';
  ch.textContent = chan;  ch.style.display = chan ? '' : 'none';
  creditEl.style.display = 'block';
}
window.addEventListener('resize', applyCredit);

function send(msg){
  if (ws && ws.readyState === 1) ws.send(JSON.stringify(msg));
}

function clearStage(){
  if (hbTimer) { clearInterval(hbTimer); hbTimer = null; }
  if (current && current.hls) { try { current.hls.destroy(); } catch(e){} }
  if (current && current.el && current.el.tagName === 'VIDEO') {
    try { current.el.pause(); } catch(e){}
  }
  current = null;
  stage.innerHTML = '';
  creditItem = null;
  applyCredit();
  var hint = document.getElementById('mutehint');
  if (hint) hint.parentNode.removeChild(hint);
}

function loadHls(){
  if (window.Hls) return Promise.resolve();
  if (hlsLib) return hlsLib;
  hlsLib = new Promise(function(res, rej){
    var s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js';
    s.onload = res;
    s.onerror = function(){ hlsLib = null; rej(new Error('could not load hls.js')); };
    document.head.appendChild(s);
  });
  return hlsLib;
}

function startHeartbeat(){
  if (hbTimer) clearInterval(hbTimer);
  hbTimer = setInterval(function(){
    if (!current || !current.el || current.el.tagName !== 'VIDEO') return;
    var v = current.el;
    if (!v.paused && !isNaN(v.currentTime)) {
      send({type:'progress', id: current.id,
            position: v.currentTime, duration: isFinite(v.duration) ? v.duration : 0});
    }
  }, 500);
}

function fail(id, message){
  // Report once; the server decides whether to retry via the Twitch embed.
  if (!current || current.id !== id || current.failed) return;
  current.failed = true;
  send({type:'error', id:id, message:String(message || 'playback error')});
}

function fmtTime(s){
  s = Math.max(0, Math.floor(s));
  return Math.floor(s/3600) + 'h' + Math.floor((s%3600)/60) + 'm' + (s%60) + 's';
}

function play(msg){
  clearStage();
  var src = msg.src || {};
  var id = msg.item && msg.item.id;
  volume = (msg.volume === undefined) ? volume : msg.volume;
  creditItem = msg.item || null;
  applyCredit();

  if (src.mode === 'iframe') {
    var host = location.hostname || 'localhost';
    var url;
    if (src.kind === 'clip') {
      url = 'https://clips.twitch.tv/embed?clip=' + encodeURIComponent(src.slug)
          + '&parent=' + encodeURIComponent(host) + '&autoplay=true';
    } else if (src.kind === 'youtube') {
      url = 'https://www.youtube.com/embed/' + encodeURIComponent(src.slug)
          + '?autoplay=1' + (src.start ? '&start=' + Math.floor(src.start) : '');
    } else {
      url = 'https://player.twitch.tv/?video=' + encodeURIComponent(src.slug)
          + '&parent=' + encodeURIComponent(host) + '&autoplay=true'
          + (src.start ? '&time=' + fmtTime(src.start) : '');
    }
    var f = document.createElement('iframe');
    f.allow = 'autoplay; fullscreen';
    f.src = url;
    stage.appendChild(f);
    current = {id:id, el:f, mode:'iframe'};
    return;
  }

  var v = document.createElement('video');
  v.autoplay = true; v.playsInline = true; v.loop = false;
  v.volume = Math.max(0, Math.min(1, volume));
  var start = src.start || 0;

  v.addEventListener('ended', function(){
    if (current && current.id === id) { clearStage(); send({type:'ended', id:id}); }
  });
  v.addEventListener('error', function(){
    var err = v.error ? ('media error ' + v.error.code) : 'media error';
    fail(id, err);
  });

  // Appended to the DOM so OBS's browser source captures the audio - same
  // reason the soundboard overlay attaches its Audio elements.
  stage.appendChild(v);
  current = {id:id, el:v, mode:src.mode};

  if (src.mode === 'hls') {
    if (v.canPlayType('application/vnd.apple.mpegurl')) {
      v.src = src.url;
      if (start) v.addEventListener('loadedmetadata', function(){ v.currentTime = start; }, {once:true});
    } else {
      loadHls().then(function(){
        if (!current || current.id !== id) return;
        var h = new Hls({startPosition: start > 0 ? start : -1});
        current.hls = h;
        h.on(Hls.Events.ERROR, function(ev, data){
          if (data && data.fatal) fail(id, 'hls ' + data.type + ': ' + data.details);
        });
        h.loadSource(src.url);
        h.attachMedia(v);
      }).catch(function(e){ fail(id, e.message); });
    }
  } else {
    v.src = src.url;
    if (start) {
      var seek = function(){ try { v.currentTime = start; } catch(e){} };
      if (v.readyState >= 1) seek();
      else v.addEventListener('loadedmetadata', seek, {once:true});
    }
  }

  var p = v.play();
  if (p && p.catch) p.catch(function(err){
    // OBS's browser source allows unmuted autoplay; a normal browser tab
    // blocks it until the page has been interacted with. Run the video muted
    // so the picture never stalls, say so, and unmute on the first click or
    // keypress. Once one clip has been unmuted, the tab has its interaction
    // and every later clip autoplays with sound immediately.
    v.muted = true;
    v.play().catch(function(e){ console.error('muted autoplay also failed:', e); });
    var hint = document.createElement('div');
    hint.id = 'mutehint';
    hint.textContent = '🔇 muted by the browser — click anywhere for sound';
    document.body.appendChild(hint);
    var unlock = function(){
      document.removeEventListener('click', unlock);
      document.removeEventListener('keydown', unlock);
      if (hint.parentNode) hint.parentNode.removeChild(hint);
      if (!current || current.el !== v) return;
      v.muted = false;
      if (v.paused) v.play().catch(function(){});
    };
    document.addEventListener('click', unlock);
    document.addEventListener('keydown', unlock);
  });
  if (msg.paused) {
    var pauseIt = function(){ try { v.pause(); } catch(e){} };
    if (v.readyState >= 2) pauseIt();
    else v.addEventListener('loadeddata', pauseIt, {once:true});
  }
  startHeartbeat();
}

var ws;
function connect(){
  var proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(proto + '://' + location.host + '/clips/ws/overlay');
  ws.onmessage = function(e){
    var m = JSON.parse(e.data);
    if (m.type === 'play') play(m);
    else if (m.type === 'pause') { if (current && current.el.tagName === 'VIDEO') current.el.pause(); }
    else if (m.type === 'resume') { if (current && current.el.tagName === 'VIDEO') current.el.play().catch(function(){}); }
    else if (m.type === 'stop') clearStage();
    else if (m.type === 'config') {
      volume = (m.config && m.config.volume !== undefined) ? m.config.volume : volume;
      if (current && current.el.tagName === 'VIDEO')
        current.el.volume = Math.max(0, Math.min(1, volume));
      creditCfg = (m.config && m.config.credit) || creditCfg;
      applyCredit();
    }
  };
  ws.onclose = function(){ setTimeout(connect, 1000); };
}
connect();
</script>
</body></html>
