<!doctype html>
<html><head><meta charset="utf-8"><title>HexCast games</title>
<style>
  html,body{margin:0;padding:0;background:transparent;overflow:hidden;height:100%;width:100%;}
  /* Fixed 1920x1080 design stage, scaled to fill the browser source, so a game's
     x/y % placement and scale mean exactly what the panel's editor shows. */
  #stage{ position:absolute; top:0; left:0; width:1920px; height:1080px; transform-origin:top left; pointer-events:none; }

  /* One full-stage layer per game. The layer carries show/hide — its
     transform-origin is set to the game's anchor, so the pop-in grows out of the
     wheel's centre. The box inside is the renderer's container and carries the
     placement (left/top % + translate/scale), exactly like the soundboard's clips. */
  .gm-layer{ position:absolute; left:0; top:0; width:1920px; height:1080px; display:none; }
  .gm-layer.gm-shown{ display:block; }
  .gm-layer.gm-in{ animation:gm-pop 350ms cubic-bezier(.2,.9,.3,1.22) both; }
  .gm-layer.gm-out{ animation:gm-fade 350ms ease-in both; }
  @keyframes gm-pop{ from{ opacity:0; transform:scale(.82); } to{ opacity:1; transform:scale(1); } }
  @keyframes gm-fade{ from{ opacity:1; } to{ opacity:0; } }
  .gm-box{
    position:absolute; left:50%; top:50%; width:400px; height:400px;
    transform:translate(-50%,-50%) scale(1.25); transform-origin:center center;
  }
</style></head>
<body>
<div id="stage"></div>

<script id="games-logic">
/* Pure reconcile logic: no DOM, no timers, no globals besides GamesLogic.
   Given what a game's overlay currently shows (a "view") and the server's STATE,
   it decides which renderer actions to run. Kept in its own <script> block so it
   can be extracted and unit-tested in node. */
var GamesLogic = (function () {
  'use strict';

  // The only keys a spin's `overrides` may change (spec: APPEARANCE keys).
  var APPEARANCE = ['x', 'y', 'scale', 'theme', 'red_color', 'black_color', 'green_color',
    'result_position', 'result_details', 'show_result', 'show_history', 'history_count',
    'show_user', 'show_bets', 'bets_max', 'sfx', 'sfx_volume'];

  function isObj(o) { return !!o && typeof o === 'object' && !Array.isArray(o); }
  function has(o, k) { return Object.prototype.hasOwnProperty.call(o, k); }

  // Shallow copy of `base` with `extra` on top (only `keys` when given).
  // null/undefined in `extra` never clobber a base value.
  function merge(base, extra, keys) {
    var out = {}, k, i;
    if (isObj(base)) for (k in base) if (has(base, k)) out[k] = base[k];
    if (isObj(extra)) {
      if (keys) {
        for (i = 0; i < keys.length; i++) {
          k = keys[i];
          if (has(extra, k) && extra[k] != null) out[k] = extra[k];
        }
      } else {
        for (k in extra) if (has(extra, k) && extra[k] != null) out[k] = extra[k];
      }
    }
    return out;
  }

  function hasOverrides(spin) {
    if (!spin || !isObj(spin.overrides)) return false;
    for (var i = 0; i < APPEARANCE.length; i++) {
      if (spin.overrides[APPEARANCE[i]] != null) return true;
    }
    return false;
  }

  // Config the renderer + container should use right now: the saved config, or the
  // saved config with this spin's appearance overrides on top while the spin lasts.
  function effectiveConfig(config, spin) {
    return hasOverrides(spin) ? merge(config, spin.overrides, APPEARANCE) : merge(config);
  }

  // Order-independent identity of a flat config (so "nothing changed" is detectable).
  function keyOf(obj) {
    var ks = Object.keys(obj || {}).sort(), parts = [];
    for (var i = 0; i < ks.length; i++) parts.push(JSON.stringify(ks[i]) + ':' + JSON.stringify(obj[ks[i]]));
    return '{' + parts.join(',') + '}';
  }

  function historyKey(state) {
    var h = state && Array.isArray(state.history) ? state.history : [];
    var last = state && isObj(state.last) && state.last.id != null ? String(state.last.id) : '';
    var labels = [];
    for (var i = 0; i < h.length; i++) labels.push(h[i] && h[i].number != null ? String(h[i].number) : '?');
    return last + '|' + h.length + '|' + labels.join(',');
  }

  function newView() {
    return {
      visible: false,       // what we show (server's STATE.visible)
      playingId: null,      // spin id the renderer is animating / showing
      mode: 'idle',         // idle | playing | result
      overrideId: null,     // spin id whose overrides are applied (null = saved config)
      appearanceKey: null,  // keyOf(effective config) last handed to the renderer/container
      historyKey: null      // historyKey(state) last handed to setHistory
    };
  }

  // The renderer instance was torn down (a hidden game costs nothing): forget what
  // it was showing so the next reconcile replays it on a fresh instance.
  function forget(view) {
    var v = merge(view || newView());
    v.playingId = null; v.mode = 'idle'; v.historyKey = null;
    return v;
  }

  /* reconcile(view, state, config) -> {view, actions}
     `state` is the server's STATE for this game (null = no state seen yet: only the
     appearance can change). Actions, executed in order:
       {type:'appearance', config, deferred}  placement + setConfig (deferred: we are
                                              fading out — apply once hidden)
       {type:'show'} | {type:'hide', immediate:false}
       {type:'play', spin} | {type:'showResult', spin} | {type:'reset', deferred}
       {type:'history', results}
     When hiding, 'hide' comes first so the fade starts before anything changes. */
  function reconcile(view, state, config) {
    var v = merge(view || newView());
    var actions = [];
    var hasState = isObj(state);
    var spin = hasState && isObj(state.spin) && state.spin.id != null ? state.spin : null;
    var visible = hasState ? !!state.visible : !!v.visible;
    var hiding = !!v.visible && !visible;
    var showing = visible && !v.visible;

    if (hiding) actions.push({ type: 'hide', immediate: false });

    // 1. appearance — saved config, or config + overrides for this spin's duration
    var eff = effectiveConfig(config, spin);
    var ak = keyOf(eff);
    if (ak !== v.appearanceKey) {
      actions.push({ type: 'appearance', config: eff, deferred: hiding });
      v.appearanceKey = ak;
    }
    v.overrideId = hasOverrides(spin) ? spin.id : null;
    if (!hasState) return { view: v, actions: actions };

    // 2. visibility (after appearance, so the pop-in starts at the right spot)
    if (showing) actions.push({ type: 'show' });
    v.visible = visible;

    // 3. the spin
    if (spin) {
      if (spin.id !== v.playingId) {
        if (state.state === 'spinning') {
          actions.push({ type: 'play', spin: spin });          // seeks by elapsed_ms
          v.mode = 'playing';
        } else {
          actions.push({ type: 'showResult', spin: spin });    // late join: already landed
          v.mode = 'result';
        }
        v.playingId = spin.id;
      } else if (state.state !== 'spinning') {
        v.mode = 'result';                                     // same spin, landed: nothing to do
      }
    } else if (v.playingId != null || v.mode !== 'idle') {
      actions.push({ type: 'reset', deferred: hiding });
      v.playingId = null; v.mode = 'idle';
    }

    // 4. history strip (only landed spins, newest first) — only when it changed
    var hk = historyKey(state);
    if (hk !== v.historyKey) {
      actions.push({ type: 'history', results: Array.isArray(state.history) ? state.history : [] });
      v.historyKey = hk;
    }
    return { view: v, actions: actions };
  }

  // {"type":"stop"}: hide immediately, reset, drop any spin overrides.
  function stop(view, config) {
    var v = merge(view || newView());
    var actions = [{ type: 'hide', immediate: true }, { type: 'reset', deferred: false }];
    v.visible = false; v.playingId = null; v.mode = 'idle'; v.overrideId = null;
    var eff = effectiveConfig(config, null), ak = keyOf(eff);
    if (ak !== v.appearanceKey) {
      actions.push({ type: 'appearance', config: eff, deferred: false });
      v.appearanceKey = ak;
    }
    return { view: v, actions: actions };
  }

  return {
    APPEARANCE: APPEARANCE, merge: merge, isObj: isObj, hasOverrides: hasOverrides,
    effectiveConfig: effectiveConfig, keyOf: keyOf, historyKey: historyKey,
    newView: newView, forget: forget, reconcile: reconcile, stop: stop
  };
})();
</script>

<script>
(function () {
'use strict';
var L = GamesLogic;
var FADE_MS = 350;

/* ---- registry ------------------------------------------------------------
   One entry per game. The script must register window.HexGames[id] with the
   renderer interface (create/setConfig/resize/play/showResult/setHistory/reset/
   destroy); `renderer` is filled in once it has loaded. `defaults` mirror the
   backend's so missing config keys fall back to the same values (American
   double-zero wheel only: there is no `wheel` key). */
var GAMES = {
  roulette: {
    script: '/static/games/roulette.js',
    renderer: null,
    defaults: {
      x: 50, y: 50, scale: 1.25, theme: 'classic',
      red_color: '', black_color: '', green_color: '',
      spin_seconds: 9, result_seconds: 6, hide_when_idle: true,
      show_result: true, result_position: 'center', result_details: true,
      show_history: true, history_count: 10, show_user: true,
      show_bets: true, bets_max: 5, sfx: true, sfx_volume: 0.5,
      spin_clip: '', land_clip: '', cooldown_seconds: 0
    }
  }
};

var stage = document.getElementById('stage');
var slots = {};          // game id -> slot (only games this source shows)
var ws = null;
var outbox = [];         // error reports queued while the socket is down

/* ---- error reporting ----------------------------------------------------- */
var errSeen = {}, errSeenN = 0, errBurst = 0, errBurstAt = 0;
function errText(e) {
  if (!e) return 'unknown error';
  if (e.stack) return String(e.stack).split('\n').slice(0, 4).join(' | ');
  return String(e.message || e);
}
function report(message) {
  message = String(message || 'error').slice(0, 1000);
  var now = Date.now();
  // De-duplicate BEFORE logging: an error thrown from a renderer's RAF loop repeats
  // every frame, and OBS copies browser-source console output into its own log.
  if (errSeen[message] && now - errSeen[message] < 30000) return;   // same error: once per 30s
  if (errSeenN > 100) { errSeen = {}; errSeenN = 0; }
  errSeen[message] = now; errSeenN++;
  if (now - errBurstAt > 60000) { errBurstAt = now; errBurst = 0; }
  if (++errBurst > 30) return;                                      // runaway-loop guard
  try { console.error('[games overlay] ' + message); } catch (e) {}
  var payload = JSON.stringify({ type: 'error', message: message });
  if (ws && ws.readyState === 1) { try { ws.send(payload); return; } catch (e) {} }
  if (outbox.length < 20) outbox.push(payload);
}
window.onerror = function (msg, src, line, col, err) {
  report(err && err.stack ? errText(err) : (msg + ' @ ' + (src || '?') + ':' + (line || 0) + ':' + (col || 0)));
};
window.addEventListener('unhandledrejection', function (e) {
  report('unhandled rejection: ' + errText(e && e.reason));
});

/* ---- stage ---------------------------------------------------------------- */
function fitStage() {
  var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
  stage.style.transform = 'scale(' + s + ')';
}
window.addEventListener('resize', function () {
  fitStage();
  eachSlot(function (slot) { resizeSlot(slot); });   // on-screen size changed → backing store
});
fitStage();

function eachSlot(fn) { for (var id in slots) if (Object.prototype.hasOwnProperty.call(slots, id)) fn(slots[id]); }
function num(v, def, lo, hi) {
  var n = parseFloat(v);
  if (!isFinite(n)) n = def;
  return Math.max(lo, Math.min(hi, n));
}

/* ---- per-game slot -------------------------------------------------------- */
function makeSlot(id) {
  var layer = document.createElement('div');
  layer.className = 'gm-layer';
  layer.setAttribute('data-game', id);
  stage.appendChild(layer);
  var defaults = GAMES[id].defaults || {};
  var slot = {
    id: id, meta: GAMES[id], layer: layer, box: null, inst: null,
    config: L.merge(defaults),     // saved config (defaults filled in)
    eff: L.merge(defaults),        // effective config: config + active spin overrides
    state: null, stateAt: 0,       // last STATE + when it arrived (performance.now)
    view: L.newView(),
    shown: false, fading: false, fadeTimer: 0, popUntil: 0, popTimer: 0,
    appearanceDirty: false, resetDirty: false,   // deferred until a fade-out finishes
    gen: 0, landing: null, landTimer: 0, pendingHistory: null, history: [],
    sizeKey: '', loadFailed: false
  };
  newBox(slot);
  return slot;
}

function baseSize(slot) {
  var R = slot.meta.renderer;
  var b = R && +R.BASE_SIZE;
  return b > 0 ? b : 400;
}

// Fresh container for a renderer instance (whatever an old one left behind goes with it).
function newBox(slot) {
  var old = slot.box;
  var box = document.createElement('div');
  box.className = 'gm-box';
  slot.layer.appendChild(box);
  if (old && old.parentNode) old.parentNode.removeChild(old);
  slot.box = box;
  slot.sizeKey = '';
  applyPlacement(slot);
}

function applyPlacement(slot) {
  var c = slot.eff, size = baseSize(slot);
  var x = num(c.x, 50, 0, 100), y = num(c.y, 50, 0, 100), s = num(c.scale, 1.25, 0.2, 5);
  var st = slot.box.style;
  st.width = size + 'px'; st.height = size + 'px';
  st.left = x + '%'; st.top = y + '%';
  st.transform = 'translate(-50%,-50%) scale(' + s + ')';
  slot.layer.style.transformOrigin = x + '% ' + y + '%';   // pop-in grows from the wheel centre
}

// Guarded renderer call: optional methods are skipped, throws are reported.
function call(slot, name, arg) {
  var inst = slot.inst;
  if (!inst || typeof inst[name] !== 'function') return undefined;
  try { return inst[name](arg); }
  catch (e) { report(slot.id + '.' + name + ': ' + errText(e)); return undefined; }
}

// Tell the renderer its on-screen size changed (backing store = on-screen px x DPR).
// Only when it really changed: resizing a canvas clears it. Never mid pop-in, where
// the animation's transform would be measured.
function resizeSlot(slot, force) {
  if (!slot.inst || !slot.shown) return;
  var wait = slot.popUntil - performance.now();
  if (wait > 0) {
    clearTimeout(slot.popTimer);
    slot.popTimer = setTimeout(function () { resizeSlot(slot, force); }, wait + 20);
    return;
  }
  var r = slot.box.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  var key = Math.round(r.width * dpr) + 'x' + Math.round(r.height * dpr);
  if (!force && key === slot.sizeKey) return;
  slot.sizeKey = key;
  call(slot, 'resize');
}

function applyAppearance(slot) {
  applyPlacement(slot);
  if (slot.inst) {
    call(slot, 'setConfig', slot.eff);
    resizeSlot(slot);
  }
}

/* ---- renderer lifecycle -------------------------------------------------- */
// Create the renderer instance (only while shown: a hidden game has none, so no RAF).
function wake(slot) {
  if (slot.inst) return true;
  var R = slot.meta.renderer;
  if (!R || typeof R.create !== 'function') return false;   // still loading (or failed: reported)
  newBox(slot);
  try { slot.inst = R.create(slot.box, slot.eff, { sound: true }) || null; }
  catch (e) { slot.inst = null; report(slot.id + '.create: ' + errText(e)); }
  if (!slot.inst) return false;
  resizeSlot(slot, true);
  return true;
}

// Tear the instance down once hidden: stops its RAF and audio entirely.
function sleep(slot) {
  clearTimeout(slot.landTimer);
  clearTimeout(slot.popTimer);
  slot.gen++; slot.landing = null; slot.pendingHistory = null;
  if (!slot.inst) return;
  call(slot, 'reset');
  call(slot, 'destroy');
  slot.inst = null;
  newBox(slot);
}

/* ---- show / hide ---------------------------------------------------------- */
function show(slot) {
  if (slot.shown) return;
  var layer = slot.layer;
  slot.shown = true;
  layer.classList.remove('gm-in', 'gm-out');
  layer.classList.add('gm-shown');
  slot.popUntil = 0;
  // Create (or re-measure) the renderer before the pop-in transform applies, so the
  // backing store is sized for the final on-screen size. Not loaded yet → rendererReady() wakes it.
  if (wake(slot)) resizeSlot(slot);
  void layer.offsetWidth;           // restart the animation
  layer.classList.add('gm-in');
  slot.popUntil = performance.now() + FADE_MS;
}

function fadeOut(slot) {
  if (!slot.shown || slot.fading) return;
  slot.fading = true;
  slot.layer.classList.remove('gm-in');
  slot.layer.classList.add('gm-out');
  clearTimeout(slot.fadeTimer);
  slot.fadeTimer = setTimeout(function () { slot.fading = false; finishHide(slot); }, FADE_MS + 30);
}

function finishHide(slot) {
  clearTimeout(slot.fadeTimer);
  slot.fading = false;
  slot.shown = false;
  slot.popUntil = 0;
  slot.layer.classList.remove('gm-shown', 'gm-in', 'gm-out');
  sleep(slot);
  slot.resetDirty = false;                         // instance is gone anyway
  if (slot.appearanceDirty) { slot.appearanceDirty = false; applyPlacement(slot); }
  slot.view = L.forget(slot.view);
}

// A fade-out got interrupted (the game is shown again): apply what it deferred.
// When the interrupting batch brings its own appearance, that one is newer — skip
// the deferred one rather than re-rendering the renderer's caches twice.
function interruptFade(slot, batchHasAppearance) {
  if (!slot.fading) return;
  clearTimeout(slot.fadeTimer);
  slot.fading = false;
  slot.shown = false;               // show() restarts the pop-in from here
  slot.layer.classList.remove('gm-out');
  if (slot.resetDirty) { slot.resetDirty = false; doReset(slot); }
  if (slot.appearanceDirty) {
    slot.appearanceDirty = false;
    if (!batchHasAppearance) applyAppearance(slot);
  }
}

/* ---- action executor ------------------------------------------------------ */
function liveSpin(slot, spin) {
  // elapsed_ms was measured when the server built the message; add the time the
  // state sat here (e.g. renderer still loading) so the landing stays on schedule.
  var s = L.merge(spin);
  var waited = slot.stateAt ? Math.max(0, performance.now() - slot.stateAt) : 0;
  s.elapsed_ms = Math.max(0, (+spin.elapsed_ms || 0) + waited);
  return s;
}

function landed(slot, gen) {
  if (slot.gen !== gen) return;
  clearTimeout(slot.landTimer);
  slot.landing = null;
  if (slot.pendingHistory) {
    var h = slot.pendingHistory;
    slot.pendingHistory = null;
    call(slot, 'setHistory', h);
  }
}

function doReset(slot) {
  if (!slot.inst) return;
  slot.gen++;
  landed(slot, slot.gen);             // flush any held-back history
  call(slot, 'reset');
}

function doPlay(slot, spin) {
  if (!slot.inst) return;
  var gen = ++slot.gen;
  if (slot.pendingHistory) { var h = slot.pendingHistory; slot.pendingHistory = null; call(slot, 'setHistory', h); }
  var sp = liveSpin(slot, spin);
  slot.landing = { gen: gen, id: sp.id };
  var p = call(slot, 'play', sp);
  if (p && typeof p.then === 'function') {
    p.then(function () { landed(slot, gen); },
           function (e) {
             // an aborted spin (reset/stop/teardown) may reject: only the live one is an error
             if (slot.gen === gen) report(slot.id + '.play rejected: ' + errText(e));
             landed(slot, gen);
           });
  }
  // Safety net: never hold the history strip back long past the scheduled landing.
  var left = Math.max(0, (+sp.duration_ms || 0) - sp.elapsed_ms);
  clearTimeout(slot.landTimer);
  slot.landTimer = setTimeout(function () { landed(slot, gen); }, left + 1500);
}

function doShowResult(slot, spin) {
  if (!slot.inst) return;
  slot.gen++;
  landed(slot, slot.gen);
  call(slot, 'showResult', liveSpin(slot, spin));
}

function doHistory(slot, results) {
  slot.history = results || [];
  if (!slot.inst) return;
  // The server's "landed" state can beat our own animation by a frame or two; the
  // strip must not spoil a ball still in the air, so hold it until we land too.
  var serverLanded = !(slot.state && slot.state.state === 'spinning');
  if (serverLanded && slot.landing && slot.landing.gen === slot.gen) {
    slot.pendingHistory = slot.history;
    return;
  }
  call(slot, 'setHistory', slot.history);
}

function exec(slot, a) {
  switch (a.type) {
    case 'appearance':
      slot.eff = a.config;
      if (slot.fading) slot.appearanceDirty = true;   // don't move a wheel that's fading out
      else applyAppearance(slot);
      break;
    case 'show': show(slot); break;
    case 'hide': if (a.immediate) finishHide(slot); else fadeOut(slot); break;
    case 'play': doPlay(slot, a.spin); break;
    case 'showResult': doShowResult(slot, a.spin); break;
    case 'reset':
      if (slot.fading) slot.resetDirty = true;         // keep the result up while it fades
      else doReset(slot);
      break;
    case 'history': doHistory(slot, a.results); break;
  }
}

function run(slot, actions) {
  var i, interrupt = false, appearance = false;
  for (i = 0; i < actions.length; i++) {
    var t = actions[i].type;
    if (t === 'show' || (t === 'hide' && actions[i].immediate)) interrupt = true;
    if (t === 'appearance') appearance = true;
  }
  if (interrupt) interruptFade(slot, appearance);
  for (i = 0; i < actions.length; i++) {
    try { exec(slot, actions[i]); }
    catch (e) { report(slot.id + ' ' + actions[i].type + ': ' + errText(e)); }
  }
  if (!slot.inst) slot.view = L.forget(slot.view);   // nothing rendered: replay on wake
}

function sync(slot) {
  // Shown but no instance: the renderer's create() threw last time (show() only
  // wakes on the hidden -> shown edge). Retry on each message; replay what's current.
  if (slot.shown && !slot.fading && !slot.inst && slot.meta.renderer && wake(slot)) {
    slot.view = L.forget(slot.view);
  }
  var r = L.reconcile(slot.view, slot.state, slot.config);
  slot.view = r.view;
  run(slot, r.actions);
}

/* ---- renderer loading ------------------------------------------------------ */
function rendererReady(slot, R) {
  slot.meta.renderer = R;
  applyPlacement(slot);                          // BASE_SIZE is known now
  sync(slot);                                    // already shown → sync() wakes it + replays the spin
}

function loadRenderer(slot) {
  var id = slot.id;
  var have = window.HexGames && window.HexGames[id];
  if (have) { rendererReady(slot, have); return; }
  var s = document.createElement('script');
  s.src = slot.meta.script;
  s.onload = function () {
    var R = window.HexGames && window.HexGames[id];
    if (R && typeof R.create === 'function') rendererReady(slot, R);
    else report(slot.meta.script + ' loaded but did not register HexGames.' + id);
  };
  s.onerror = function () {
    if (s.parentNode) s.parentNode.removeChild(s);
    if (!slot.loadFailed) report('could not load ' + slot.meta.script + ' — retrying');
    slot.loadFailed = true;
    setTimeout(function () { loadRenderer(slot); }, 5000);
  };
  document.head.appendChild(s);
}

/* ---- messages -------------------------------------------------------------- */
function handle(m) {
  if (!m || typeof m !== 'object') return;
  if (m.type === 'config') {
    var all = L.isObj(m.config) ? m.config : {};
    eachSlot(function (slot) {
      slot.config = L.merge(slot.meta.defaults, L.isObj(all[slot.id]) ? all[slot.id] : {});
      sync(slot);
    });
  } else if (m.type === 'state') {
    var slot = slots[m.game];
    if (!slot || !L.isObj(m.state)) return;
    slot.state = m.state;
    slot.stateAt = performance.now();
    sync(slot);
  } else if (m.type === 'stop') {
    // {"type":"stop"} stops everything; {"type":"stop","game":id} just that game.
    var only = typeof m.game === 'string' && m.game ? m.game : null;
    eachSlot(function (slot) {
      if (only && slot.id !== only) return;
      var r = L.stop(slot.view, slot.config);
      slot.view = r.view;
      if (slot.state) {                          // the aborted spin must not replay before
        var st = L.merge(slot.state);            // the server's follow-up state arrives
        st.spin = null; st.visible = false; st.state = 'idle';
        slot.state = st;
      }
      run(slot, r.actions);
    });
  }
}

/* ---- websocket --------------------------------------------------------------- */
function connect() {
  var proto = location.protocol === 'https:' ? 'wss' : 'ws';
  var sock;
  try { sock = new WebSocket(proto + '://' + location.host + '/games/ws/overlay'); }
  catch (e) { setTimeout(connect, 1000); return; }
  ws = sock;
  sock.onopen = function () {
    var shown = Object.keys(slots);     // only games this source really shows (?game=bogus → null)
    try { sock.send(JSON.stringify({ type: 'hello', game: WANT.length && shown.length === 1 ? shown[0] : null })); } catch (e) {}
    while (outbox.length && sock.readyState === 1) {
      try { sock.send(outbox.shift()); } catch (e) { break; }
    }
  };
  sock.onmessage = function (e) {
    var m;
    try { m = JSON.parse(e.data); } catch (err) { return; }
    try { handle(m); } catch (err) { report('message ' + (m && m.type) + ': ' + errText(err)); }
  };
  sock.onclose = function () {
    if (ws === sock) ws = null;
    setTimeout(connect, 1000);
  };
  sock.onerror = function () { try { sock.close(); } catch (err) {} };
}

/* ---- boot ------------------------------------------------------------------- */
// ?game=roulette limits which games this browser source shows (comma list ok).
var WANT = [];
try {
  WANT = (new URLSearchParams(location.search).get('game') || '').toLowerCase()
    .split(',').map(function (s) { return s.trim(); }).filter(Boolean);
} catch (e) { WANT = []; }
WANT.forEach(function (w) { if (!GAMES[w]) report('unknown game "' + w + '" in ?game='); });
Object.keys(GAMES).forEach(function (id) {
  if (!WANT.length || WANT.indexOf(id) >= 0) slots[id] = makeSlot(id);
});

// Debug / test hook (devtools: HexGamesOverlay.slots.roulette).
window.HexGamesOverlay = { GAMES: GAMES, slots: slots, handle: handle, report: report };

eachSlot(loadRenderer);
connect();
})();
</script>
