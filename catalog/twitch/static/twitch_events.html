<!doctype html>
<html><head><meta charset="utf-8"><title>HexCast alerts</title>
<link rel="stylesheet" href="/twitch/overlay.css">
<style>
  html,body{margin:0;padding:0;background:transparent;overflow:hidden;height:100%;width:100%;}
  /* Fixed 1920x1080 design stage scaled to fill the source (same as chat). */
  #scaler{ position:absolute; top:0; left:0; width:1920px; height:1080px; transform-origin:top left; }
  #stage{
    position:absolute; inset:0; display:flex; padding:24px; box-sizing:border-box;
  }
  #stage.left{ justify-content:flex-start; } #stage.center{ justify-content:center; } #stage.right{ justify-content:flex-end; }
  #stage.top{ align-items:flex-start; } #stage.middle{ align-items:center; } #stage.bottom{ align-items:flex-end; }

  /* Background box (placement mode): shown only while an alert is on screen, so
     the frame/image fades in with the alert and out with it. */
  #bgbox{ position:absolute; z-index:0; opacity:0; pointer-events:none; transition:opacity var(--fade-out,.5s) ease; }
  #bgbox.show{ opacity:1; transition:opacity var(--fade-in,.45s) ease; }
  /* In placement mode the alert is positioned/sized by its own box and centres
     its text; the background lives on #bgbox instead of the alert. padding:0 so
     the alert's % coordinates match the background box (both vs the full stage). */
  #stage.boxed{ padding:0; }
  #stage.boxed .alert{ position:absolute; overflow:hidden; max-width:none; padding:var(--bg-pad,20px); }

  .alert{
    position:relative;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:var(--pic-gap,14px);
    box-sizing:border-box;
    font-family:var(--font), 'Segoe UI', system-ui, sans-serif;
    color:var(--fg,#fff);
    border-radius:var(--bg-radius,18px);
    padding:var(--pad-y,22px) var(--pad-x,34px);
    text-align:center;
    max-width:1728px;                           /* 90% of the 1920 design width */
    letter-spacing:var(--ls,0);
    -webkit-text-stroke:var(--stroke,0) var(--stroke-color,#000);
    paint-order:stroke fill;
    text-shadow:var(--shadow,none);
  }
  .alert.bgs-image{ padding:calc(var(--pad-y,22px) + var(--bg-pad,20px)) calc(var(--pad-x,34px) + var(--bg-pad,20px)); }
  .alert.bgs-slice{ padding:var(--bg-pad,20px) calc(12px + var(--bg-pad,20px)); }
  /* The picture shown with an alert, above, below or beside the text. */
  .alert.img-bottom{ flex-direction:column-reverse; }
  .alert.img-left{ flex-direction:row; }
  .alert.img-right{ flex-direction:row-reverse; }
  .pic{ flex:none; height:var(--pic-size,120px); width:auto; max-width:100%; object-fit:contain; }
  .txt{ min-width:0; }
  /* The coloured edge: on the alert in the classic mode, on the background box in placement mode. */
  .bar-top::after,.bar-bottom::after,.bar-left::after{ content:''; position:absolute; background:var(--accent,#ff3b30); pointer-events:none; }
  .bar-top::after   { left:0; right:0; top:0;    height:var(--bar-w,3px); border-radius:var(--bg-radius,18px) var(--bg-radius,18px) 0 0; }
  .bar-bottom::after{ left:0; right:0; bottom:0; height:var(--bar-w,3px); border-radius:0 0 var(--bg-radius,18px) var(--bg-radius,18px); }
  .bar-left::after  { top:0; bottom:0; left:0;   width:var(--bar-w,3px);  border-radius:var(--bg-radius,18px) 0 0 var(--bg-radius,18px); }

  /* "Automatic" in the classic mode is what alerts always had: a border along the top that follows the corners. */
  .alert.auto-top{ border-top:var(--bar-w,3px) solid var(--accent,#ff3b30); }
  .title{
    font-family:var(--title-font), 'Segoe UI', system-ui, sans-serif;
    font-size:var(--sub,26px); font-weight:var(--title-w,800); letter-spacing:var(--title-ls,.14em);
    text-transform:var(--title-tt,uppercase); color:var(--title-color,var(--accent,#ff3b30)); margin-bottom:6px;
  }
  .body{ font-size:var(--size,40px); font-weight:var(--body-w,800); line-height:1.15; text-transform:var(--tt,none); color:var(--body-color,inherit); }
  .note{ font-size:var(--sub,26px); font-weight:500; opacity:.82; margin-top:10px; font-style:var(--note-style,italic); color:var(--note-color,inherit); }

  @keyframes popIn{ 0%{opacity:0; transform:scale(.8) translateY(14px);} 60%{transform:scale(1.04);} 100%{opacity:1; transform:none;} }
  @keyframes slideIn{ from{opacity:0; transform:translateY(-30px);} to{opacity:1; transform:none;} }
  .anim-pop{ animation:popIn var(--anim-dur,.45s) cubic-bezier(.2,.9,.3,1.25) backwards; }
  .anim-slide{ animation:slideIn var(--anim-dur,.45s) cubic-bezier(.2,.8,.3,1) backwards; }
  @media (prefers-reduced-motion: reduce){ .anim-pop,.anim-slide{ animation:none !important; } }
</style></head>
<body>
<div id="scaler">
  <div id="bgbox"></div>
  <div id="stage"></div>
</div>
<script src="/twitch/boot.js"></script>
<script>

var CFG = null;
var PREVIEW = isPreview();      // the panel's live preview: no socket, nothing fades, drawn from postMessage
var scaler = document.getElementById('scaler');
var stage = document.getElementById('stage');
var bgbox = document.getElementById('bgbox');
var WS = null;

function fitStage(){
  var s = Math.min(window.innerWidth/1920, window.innerHeight/1080);
  scaler.style.transform = 'scale(' + s + ')';
}
window.addEventListener('resize', fitStage);
fitStage();

// A variable that is only set when the panel gives a value, so the CSS fallback applies otherwise.
function optVar(r, name, value){
  if(value) r.setProperty(name, value); else r.removeProperty(name);
}
// The coloured edge of an alert. "auto" keeps what alerts always did: a border along the top in the classic
// mode (where the style leaves room for one), nothing in placement mode. top, bottom and left draw a bar.
var EDGE_STYLES = ['solid', 'gradient', 'animated', 'image', 'glass'];
function edgeClasses(e, style){
  var m = e.accent_bar || 'auto';
  if(m === 'none') return '';
  if(m === 'auto') return !e.box_enabled && EDGE_STYLES.indexOf(style) >= 0 ? ' auto-top' : '';
  return ' bar-' + m;
}

function applyConfig(cfg){
  CFG = cfg;
  var e = cfg.events, r = document.documentElement.style;
  loadFont(e.font_family);
  if(e.title_font_family) loadFont(e.title_font_family);
  r.setProperty('--font', fontVar(e.font_family));
  r.setProperty('--title-font', fontVar(e.title_font_family || e.font_family));
  r.setProperty('--size', e.font_size + 'px');
  r.setProperty('--sub', e.sub_font_size + 'px');
  r.setProperty('--fg', e.text_color);
  r.setProperty('--accent', e.accent_color);
  optVar(r, '--title-color', e.title_color);
  optVar(r, '--body-color', e.body_color);
  optVar(r, '--note-color', e.note_color);
  r.setProperty('--title-w', _num(e.title_weight, 800));
  r.setProperty('--body-w', _num(e.body_weight, 800));
  r.setProperty('--title-ls', _num(e.title_spacing, 0.14) + 'em');
  r.setProperty('--title-tt', e.title_transform || 'uppercase');
  r.setProperty('--tt', e.text_transform || 'none');
  r.setProperty('--ls', _num(e.letter_spacing, 0) + 'px');
  r.setProperty('--note-style', e.note_italic === false ? 'normal' : 'italic');
  r.setProperty('--pad-x', _num(e.pad_x, 34) + 'px');
  r.setProperty('--pad-y', _num(e.pad_y, 22) + 'px');
  r.setProperty('--bar-w', _num(e.accent_bar_width, 3) + 'px');
  r.setProperty('--fade-in', (e.fade_in == null ? 0.45 : e.fade_in) + 's');
  r.setProperty('--fade-out', (e.fade_out == null ? 0.5 : e.fade_out) + 's');
  r.setProperty('--out-dur', (e.fade_out == null ? 0.5 : e.fade_out) + 's');
  r.setProperty('--stroke', e.outline ? _num(e.outline_width, 2) + 'px' : '0');
  r.setProperty('--stroke-color', e.outline_color);
  r.setProperty('--shadow', e.shadow ? shadowCss(e) : 'none');
  bgVars(r, e);
  applyCustomCss(e.custom_css);
  // In placement mode the alert box positions the text and the background lives
  // on #bgbox; otherwise the legacy align/valign centring + per-alert bg is used.
  if(e.box_enabled){
    stage.className = 'boxed';
  } else {
    stage.className = e.align + ' ' + e.valign;
    bgbox.className = '';   // no separate bg box in legacy mode
  }
}

function show(ev, still){                    // `still`: the preview redrawing after a setting changed, so no entrance
  var e = CFG.events;
  var rule = (CFG.alerts || {})[ev.kind] || {};              // what this kind of alert looks like, if it differs
  var accent = rule.accent_color || e.accent_color;
  var anim = rule.animation || e.animation;
  var bgUrl = rule.bg_image_url || e.bg_image_url;
  var style = bgStyleFor(e.bg_style, bgUrl);
  var fadeIn = e.fade_in == null ? 0.45 : e.fade_in;

  var el = document.createElement('div');
  el.className = 'alert kind-' + String(ev.kind || '').replace(/[^a-z0-9_-]/gi, '') +
                 (anim && anim !== 'none' && !still ? ' anim-' + anim : '');
  el.style.setProperty('--anim-dur', fadeIn + 's');
  el.style.setProperty('--accent', accent);
  var pos = ['top', 'bottom', 'left', 'right'].indexOf(rule.image_pos) >= 0 ? rule.image_pos : 'top';
  var html = '';
  if(rule.image){
    el.className += ' img-' + pos;
    el.style.setProperty('--pic-size', _num(rule.image_size, 120) + 'px');
    html += '<img class="pic" src="' + esc(rule.image) + '" alt="">';
  }
  html += '<div class="txt"><div class="title">' + esc(ev.title) + '</div>';
  html += '<div class="body">' + esc(ev.body) + '</div>';
  if(ev.message) html += '<div class="note">' + esc(ev.message) + '</div>';
  html += '</div>';
  el.innerHTML = html;

  if(e.box_enabled){
    // Position the alert text box, and the background box, then fade the
    // background in with the alert.
    el.style.left = e.box_x + '%'; el.style.top = e.box_y + '%';
    el.style.width = e.box_w + '%'; el.style.height = e.box_h + '%';
    if(e.bg_full){
      bgbox.style.left = '0'; bgbox.style.top = '0'; bgbox.style.width = '100%'; bgbox.style.height = '100%';
    } else {
      bgbox.style.left = e.bg_box_x + '%'; bgbox.style.top = e.bg_box_y + '%';
      bgbox.style.width = e.bg_box_w + '%'; bgbox.style.height = e.bg_box_h + '%';
    }
    bgbox.className = bgClass(style) + edgeClasses(e, style);
    bgbox.style.setProperty('--accent', accent);
    bgbox.style.setProperty('--bg-image', cssUrl(bgUrl));
    bgbox.style.transition = still ? 'none' : '';
    void bgbox.offsetWidth;              // reflow so the fade-in transition runs
    bgbox.classList.add('show');
  } else {
    el.className += ' ' + bgClass(style) + edgeClasses(e, style);
    if(rule.bg_image_url) el.style.setProperty('--bg-image', cssUrl(rule.bg_image_url));
  }
  if(PREVIEW) stage.innerHTML = '';      // the preview holds one alert, for as long as it is being looked at
  stage.appendChild(el);
  if(PREVIEW) return;

  var fadeOutMs = (e.fade_out == null ? 0.5 : e.fade_out) * 1000;
  var out = e.animation_out || 'fade';
  setTimeout(function(){
    if(out !== 'none') el.className += ' leaving out-' + out;
    if(e.box_enabled) bgbox.classList.remove('show');   // fade the background out too
    setTimeout(function(){
      el.remove();
      setTimeout(function(){
        if(WS && WS.readyState === WebSocket.OPEN) {
          WS.send(JSON.stringify({type: "alert_complete", id: ev.id}));
        }
      }, (CFG.events.gap_between || 0) * 1000);
    }, out === 'none' ? 40 : fadeOutMs + 40);
  }, (ev.duration || e.default_duration) * 1000);
}

if(PREVIEW){
  listenPreview(function(m){
    if(m.type === 'config') applyConfig(m.config);
    else if(m.type === 'event' && CFG) show(m.event, !!m.still);
  });
} else {
  WS = connect('/twitch/ws/events', function(m){
    if(m.type === 'config'){ applyConfig(m.config); return; }
    if(m.type === 'event' && CFG){
      show(m);
    }
  });
}

</script></body></html>
