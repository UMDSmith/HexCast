<!doctype html>
<html><head><meta charset="utf-8"><title>HexCast chat</title>
<link rel="stylesheet" href="/twitch/overlay.css">
<style>
  html,body{margin:0;padding:0;background:transparent;overflow:hidden;height:100%;width:100%;}
  /* Everything is laid out on a fixed 1920x1080 "design stage" and then scaled
     to fill the browser source, so px sizes (font, padding, frame) and %
     positions scale together no matter how big the source/window is. */
  #stage{ position:absolute; top:0; left:0; width:1920px; height:1080px; transform-origin:top left; }
  /* Background panel layer. Sits behind the messages; JS positions it (whole
     screen or its own box) and gives it the style's classes when placement is on. */
  #bgbox{ position:absolute; inset:0; z-index:0; display:none; pointer-events:none; }
  #bgbox.on{ display:block; }
  #wrap{
    position:absolute; inset:0; z-index:1;
    display:flex; flex-direction:column;
    padding:8px; box-sizing:border-box;
  }
  /* Placement mode: JS sets left/top/width/height inline; clip messages to it. */
  #wrap.boxed{ overflow:hidden; }
  #wrap.bottom{ justify-content:flex-end; }
  #wrap.top{ justify-content:flex-start; }
  /* The oldest lines fade out over the first --fade-edge px of the chat box. */
  #wrap.fade-edge.bottom{ -webkit-mask-image:linear-gradient(to bottom, transparent 0, #000 var(--fade-edge,0px)); mask-image:linear-gradient(to bottom, transparent 0, #000 var(--fade-edge,0px)); }
  #wrap.fade-edge.top{ -webkit-mask-image:linear-gradient(to top, transparent 0, #000 var(--fade-edge,0px)); mask-image:linear-gradient(to top, transparent 0, #000 var(--fade-edge,0px)); }
  #list{ display:flex; flex-direction:column; gap:var(--gap,8px); width:var(--width,100%); }
  #wrap.left  #list{ margin-right:auto; align-items:flex-start; text-align:left; }
  #wrap.center #list{ margin:0 auto;     align-items:center;    text-align:center; }
  #wrap.right #list{ margin-left:auto;  align-items:flex-end;  text-align:right; }

  .msg{
    position:relative;
    font-family:var(--font), 'Segoe UI', system-ui, sans-serif;
    font-size:var(--size,28px);
    font-weight:var(--weight,600);
    line-height:var(--lh,1.35);
    letter-spacing:var(--ls,0);
    text-transform:var(--tt,none);
    color:var(--fg,#f2f2f7);
    border-radius:var(--bg-radius,14px);
    padding:var(--pad,12px);
    max-width:100%;
    word-wrap:break-word;
    overflow-wrap:anywhere;
    -webkit-text-stroke:var(--stroke,0px) var(--stroke-color,#000);
    paint-order:stroke fill;
    text-shadow:var(--shadow,none);
    transform-origin:left center;
  }
  /* Image backgrounds get extra breathing room so the text doesn't sit on the
     artwork edge (--bg-pad, on top of the normal padding). */
  .msg.bgs-image{ padding:calc(var(--pad,12px) + var(--bg-pad,20px)); }
  .msg.bgs-slice{ padding:var(--bg-pad,20px); }
  /* In placement mode the soft shadow belongs to the panel, not to every bubble on it. */
  #wrap.boxed .msg.bgs{ filter:none; }
  /* A bar down the left of a first-time chatter's line, or a broadcaster's, mod's, VIP's, sub's. */
  .msg[data-bar]::after{
    content:''; position:absolute; left:0; top:0; bottom:0; width:var(--bar-w,4px);
    background:var(--bar-color,#ff3b30); border-radius:var(--bg-radius,14px) 0 0 var(--bg-radius,14px);
  }
  .msg.stacked .name{ display:block; margin-bottom:2px; }
  .name{
    font-family:var(--name-font), 'Segoe UI', system-ui, sans-serif;
    font-size:calc(1em * var(--name-scale,1));
    font-weight:var(--nameweight,800);
    text-transform:var(--nt,none);
  }
  .colon{ opacity:.55; margin-right:.28em; }
  .badge{ height:var(--badge,1em); vertical-align:-0.14em; margin-right:.22em; }
  .emote{ height:var(--emote,34px); vertical-align:middle; margin:-0.25em 2px; }
  .mention{ color:var(--highlight,#ff3b30); font-weight:800; }
  .cheer{ color:#c99cff; font-weight:800; }
  .time{ opacity:.45; font-size:.7em; margin-right:.4em; font-variant-numeric:tabular-nums; }
  .chan{ opacity:.6; font-size:.7em; font-weight:700; letter-spacing:.04em; text-transform:uppercase; margin-right:.5em; }
  .reply{ display:block; font-size:.62em; opacity:.55; margin-bottom:2px; }

  @keyframes slideIn{ from{ opacity:0; transform:translateX(-14px);} to{ opacity:1; transform:none;} }
  @keyframes popIn  { 0%{ opacity:0; transform:scale(.86);} 60%{ transform:scale(1.03);} 100%{ opacity:1; transform:scale(1);} }
  .anim-slide{ animation:slideIn var(--anim-dur,.3s) cubic-bezier(.2,.8,.3,1) backwards; }
  .anim-pop  { animation:popIn var(--anim-dur,.3s) cubic-bezier(.2,.9,.3,1.2) backwards; }
  @media (prefers-reduced-motion: reduce){ .anim-slide,.anim-pop{ animation:none !important; } }
</style></head>
<body>
<div id="stage">
  <div id="bgbox"></div>
  <div id="wrap"><div id="list"></div></div>
</div>
<script src="/twitch/boot.js"></script>
<script>

var CFG = null;
var PREVIEW = isPreview();      // the panel's live preview: no socket, no fading, drawn from postMessage
var stage = document.getElementById('stage');
var bgbox = document.getElementById('bgbox');
var wrap = document.getElementById('wrap');
var list = document.getElementById('list');

// Scale the 1920x1080 design stage to fill the source, keeping aspect so the
// frame never distorts. Everything (px sizes + % positions) scales together.
function fitStage(){
  var s = Math.min(window.innerWidth/1920, window.innerHeight/1080);
  stage.style.transform = 'scale(' + s + ')';
}
window.addEventListener('resize', fitStage);
fitStage();

// The classes that paint one message's background: nothing, a plain bubble (in placement mode the panel
// carries the chosen style), or - in the classic mode - the chosen style on each message.
function msgBgClass(){
  var c = CFG.chat;
  if(!c.bubble) return '';
  return bgClass(c.box_enabled ? 'solid' : bgStyleFor(c.bg_style, c.bg_image_url));
}
function paintMsgBg(el){
  el.className = el.className.replace(/(^|\s)bgs(-\w+)?(?=\s|$)/g, ' ').replace(/\s+/g, ' ').trim();
  var b = msgBgClass();
  if(b) el.className += ' ' + b;
}

function applyConfig(cfg){
  CFG = cfg;
  var c = cfg.chat, r = document.documentElement.style;
  loadFont(c.font_family);
  if(c.name_font_family) loadFont(c.name_font_family);
  r.setProperty('--font', fontVar(c.font_family));
  r.setProperty('--name-font', fontVar(c.name_font_family || c.font_family));
  r.setProperty('--name-scale', _num(c.name_scale, 100) / 100);
  r.setProperty('--size', c.font_size + 'px');
  r.setProperty('--weight', c.font_weight);
  r.setProperty('--nameweight', c.name_weight);
  r.setProperty('--lh', c.line_height);
  r.setProperty('--ls', _num(c.letter_spacing, 0) + 'px');
  r.setProperty('--tt', c.text_transform || 'none');
  r.setProperty('--nt', c.name_transform || 'none');
  r.setProperty('--fg', c.text_color);
  r.setProperty('--gap', c.gap + 'px');
  r.setProperty('--pad', c.padding + 'px');
  r.setProperty('--emote', c.emote_size + 'px');
  r.setProperty('--badge', (_num(c.badge_scale, 100) / 100) + 'em');
  r.setProperty('--highlight', c.highlight_color);
  r.setProperty('--width', c.width_percent + '%');
  r.setProperty('--out-dur', c.fade_duration + 's');
  r.setProperty('--anim-dur', _num(c.anim_duration, 0.3) + 's');
  r.setProperty('--bar-w', _num(c.role_bar_width, 4) + 'px');
  r.setProperty('--fade-edge', _num(c.fade_edge, 0) + 'px');
  r.setProperty('--stroke', c.outline ? c.outline_width + 'px' : '0px');
  r.setProperty('--stroke-color', c.outline_color);
  r.setProperty('--shadow', c.shadow ? shadowCss(c) : 'none');
  // Both the message bubbles and the panel behind them read the same --bg-* variables.
  bgVars(r, c);
  applyCustomCss(c.custom_css);
  var valign = (c.direction === 'top' ? 'top' : 'bottom');
  var edge = _num(c.fade_edge, 0) > 0 ? ' fade-edge' : '';

  if(c.box_enabled){
    // Two independent boxes: the CHAT box (where messages sit, clipped) and the
    // BACKGROUND box (the red placement box) which carries the chosen style -
    // gradient, glass, solid, image frame, etc. Both are fixed-size; nothing
    // resizes with the chat. The background box's width auto-snaps to the image
    // when an image style is used (handled in the panel); its height is set by
    // dragging, which stretches a 9-slice frame.
    wrap.style.left = c.box_x + '%'; wrap.style.top = c.box_y + '%';
    wrap.style.width = c.box_w + '%'; wrap.style.height = c.box_h + '%';
    wrap.style.right = 'auto'; wrap.style.bottom = 'auto'; wrap.style.maxHeight = '';
    if(c.bg_full){
      bgbox.style.left = '0'; bgbox.style.top = '0';
      bgbox.style.width = '100%'; bgbox.style.height = '100%';
    } else {
      bgbox.style.left = c.bg_box_x + '%'; bgbox.style.top = c.bg_box_y + '%';
      bgbox.style.width = c.bg_box_w + '%'; bgbox.style.height = c.bg_box_h + '%';
    }
    bgbox.className = 'on ' + bgClass(bgStyleFor(c.bg_style, c.bg_image_url));
    wrap.className = 'boxed ' + valign + ' ' + c.align + edge;
  } else {
    // Legacy: chat flows over the whole source; background is per-message.
    wrap.style.left = ''; wrap.style.top = ''; wrap.style.width = '';
    wrap.style.height = ''; wrap.style.maxHeight = ''; wrap.style.right = ''; wrap.style.bottom = '';
    bgbox.className = '';
    wrap.className = valign + ' ' + c.align + edge;
  }
  [].forEach.call(list.children, paintMsgBg);        // lines already on screen follow the new style
  trim();
}

function renderFragments(frags){
  return (frags || []).map(function(f){
    if(f.t === 'emote') return '<img class="emote" src="' + esc(f.url) + '" alt="' + esc(f.name) + '">';
    if(f.t === 'mention') return '<span class="mention">' + esc(f.v) + '</span>';
    if(f.t === 'cheer') return '<span class="cheer">' + esc(f.v) + '</span>';
    return esc(f.v);
  }).join('');
}

function nameColor(msg){
  var c = CFG.chat;
  if(c.name_color_mode === 'custom') return c.name_color;
  return msg.user.color || c.name_color;
}

// The colour of the bar beside a line, or '' for none: first-time chatters, then roles.
function barColor(flags){
  var c = CFG.chat;
  flags = flags || {};
  if(c.highlight_first && flags.first) return c.highlight_color;
  if(!c.mark_roles) return '';
  var role = flags.broadcaster ? 'broadcaster' : flags.mod ? 'mod' : flags.vip ? 'vip' : flags.sub ? 'sub' : '';
  return role ? c[role + '_color'] || '' : '';
}

function addMessage(msg, still){          // `still`: the preview redrawing a line, so no entrance
  if(!CFG) return;
  var c = CFG.chat;
  var el = document.createElement('div');
  var anim = c.animation && c.animation !== 'none' && !still ? ' anim-' + c.animation : '';
  el.className = 'msg' + anim + (c.layout === 'stacked' ? ' stacked' : '');
  var flags = msg.flags || {};
  if(flags.first) el.className += ' first';
  ['broadcaster', 'mod', 'vip', 'sub'].forEach(function(k){ if(flags[k]) el.className += ' role-' + k; });
  var bar = barColor(flags);
  if(bar){ el.dataset.bar = '1'; el.style.setProperty('--bar-color', bar); }
  paintMsgBg(el);
  el.dataset.id = msg.id;
  el.dataset.channel = msg.channel || '';

  var html = '';
  if(msg.reply) html += '<span class="reply">replying to ' + esc(msg.reply.user) + '</span>';
  if(c.show_channel && (msg.channel_label || msg.channel)) html += '<span class="chan">' + esc(msg.channel_label || msg.channel) + '</span>';
  if(c.show_timestamps){
    var d = new Date(msg.ts * 1000);
    html += '<span class="time">' + String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0') + '</span>';
  }
  if(c.show_badges && msg.user.badges){
    msg.user.badges.forEach(function(b){
      html += '<img class="badge" src="' + esc(b.url) + '" title="' + esc(b.title) + '">';
    });
  }
  html += '<span class="name" style="color:' + esc(nameColor(msg)) + '">' + esc(msg.user.name) + '</span>';
  html += '<span class="colon">' + (c.layout === 'stacked' ? '' : ':') + '</span>';
  html += renderFragments(msg.fragments);
  el.innerHTML = html;

  list.appendChild(el);
  trim();

  if(c.fade_after > 0 && !PREVIEW){
    setTimeout(function(){
      var out = c.animation_out || 'fade';
      if(out === 'none'){ el.remove(); return; }
      el.className += ' leaving out-' + out;
      setTimeout(function(){ el.remove(); }, c.fade_duration * 1000 + 60);
    }, c.fade_after * 1000);
  }
}

function trim(){
  if(!CFG) return;
  var max = CFG.chat.max_messages || 25;
  while(list.children.length > max) list.removeChild(list.firstChild);
}

function clearChat(channel){
  // a chat clear in one channel empties that channel's lines only
  if(!channel) list.innerHTML = '';
  else [].slice.call(list.children).forEach(function(n){ if(n.dataset.channel === channel) n.remove(); });
}

if(PREVIEW){
  // The lines the panel sent are kept, so a change of setting can redraw them in the new style.
  var SAMPLE = [];
  listenPreview(function(m){
    if(m.type === 'config'){
      applyConfig(m.config);
      list.innerHTML = '';
      SAMPLE.forEach(function(s){ addMessage(s, true); });
    }
    else if(m.type === 'chat'){ SAMPLE.push(m.message); addMessage(m.message); }
    else if(m.type === 'clear'){ SAMPLE = []; clearChat(''); }
  });
} else {
  connect('/twitch/ws/chat', function(m){
    if(m.type === 'config') applyConfig(m.config);
    else if(m.type === 'chat') addMessage(m);
    else if(m.type === 'clear') clearChat(m.channel);
    else if(m.type === 'delete'){
      var n = list.querySelector('[data-id="' + m.id + '"]');
      if(n) n.remove();
    }
  });
}
</script></body></html>
